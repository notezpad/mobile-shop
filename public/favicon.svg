<?xml version="1.0" encoding="UTF-8"?>
<!--
  Nezam POS — اللوجو الرسمي (v2)
  حرف N هندسي + نقطة ذهبية (بادج) تربطه بلون التمييز في العناوين.
  مرسوم paths بالكامل — نفس الشكل في كل المتصفحات والأحجام.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="nzBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#12d99b"/>
      <stop offset="55%"  stop-color="#00b47f"/>
      <stop offset="100%" stop-color="#00654a"/>
    </linearGradient>
    <radialGradient id="nzGlow" cx="28%" cy="16%" r="85%">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="62%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nzN" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8fff7"/>
    </linearGradient>
    <linearGradient id="nzGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffe27a"/>
      <stop offset="100%" stop-color="#ffc247"/>
    </linearGradient>
  </defs>

  <!-- الخلفية -->
  <rect x="24" y="24" width="464" height="464" rx="112" ry="112" fill="url(#nzBg)"/>
  <rect x="24" y="24" width="464" height="464" rx="112" ry="112" fill="url(#nzGlow)"/>

  <!-- حرف N: عمودين + ضلع مائل -->
  <g fill="url(#nzN)">
    <!-- العمود اليمين -->
    <rect x="148" y="156" width="58" height="200" rx="18"/>
    <!-- العمود الشمال -->
    <rect x="306" y="156" width="58" height="200" rx="18"/>
    <!-- الضلع المائل: من أعلى اليمين لأسفل الشمال -->
    <polygon points="148,156 206,156 364,356 306,356"/>
  </g>

  <!-- النقطة الذهبية — زي بادج الإشعارات على كتف الحرف -->
  <circle cx="352" cy="148" r="25" fill="url(#nzGold)"/>
  <circle cx="344" cy="140" r="8" fill="#fff8dd" opacity="0.9"/>
</svg>
