name = "mobile-shop"
main = "./src/index.ts"
compatibility_date = "2024-09-25"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[observability]
enabled = true

[vars]
ENVIRONMENT = "production"
APP_NAME = "Mobile Shop ERP API"
APP_VERSION = "0.1.0"
LOG_LEVEL = "warn"
CORS_ORIGIN = "*"

# ─── Secrets (set via dashboard: Settings → Variables and Secrets → Add → Secret) ───
# SUPABASE_URL
# SUPABASE_SERVICE_ROLE_KEY
# JWT_SECRET

[env.staging]
name = "mobile-shop-staging"
vars = { ENVIRONMENT = "staging", LOG_LEVEL = "info" }

[env.production]
name = "mobile-shop"
vars = { ENVIRONMENT = "production", LOG_LEVEL = "warn" }
